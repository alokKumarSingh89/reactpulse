services:
  postgres:
    image: postgres:17
    container_name: reactpulse-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: reactpulse
      POSTGRES_PASSWORD: reactpulse
      POSTGRES_DB: reactpulse

    ports:
      - "5432:5432"

    volumes:
      - reactpulse_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reactpulse -d reactpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    container_name: reactpulse-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  reactpulse_postgres_data:
